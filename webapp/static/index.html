<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Summerfield Studio</title>
  <meta name="description" content="On-brand training videos and SOP cards for Summerfield Tea Bar">
  <meta name="theme-color" content="#E3E8E3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Studio">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="top" id="top" hidden>
    <a class="brand" href="#/"><span class="mark" id="brandMark"></span><span class="brand-text">Summerfield <em>Studio</em></span></a>
    <nav class="tabs" id="tabs">
      <a href="#/" data-tab="videos"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z"/></svg><span>Videos</span></a>
      <a href="#/new" data-tab="new"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg><span>New</span></a>
      <a href="#/cards" data-tab="cards"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg><span>Cards</span></a>
      <a href="#/brand" data-tab="brand"><svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M9 12.5c2-3 4-3.5 6-4M10 15l4.5-6.5"/></svg><span>Brand</span></a>
      <a href="#/team" data-tab="team" id="teamTab" hidden><svg viewBox="0 0 24 24"><circle cx="9" cy="9" r="3.2"/><path d="M3.5 19c.8-3 3-4.5 5.5-4.5s4.7 1.5 5.5 4.5"/><circle cx="17" cy="10" r="2.5"/><path d="M16 14.6c2 .2 3.6 1.5 4.3 3.9"/></svg><span>Team</span></a>
    </nav>
    <button class="account" id="accountBtn" aria-label="Account"></button>
  </header>
  <div class="stripe" id="stripe" hidden></div>
  <main id="app" class="app"></main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/static/app.js"></script>
</body>
</html>
